name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,structure,guest,advanced]'
      - run: python -m pytest -q
      # The curated skill intentionally no longer ships the legacy
      # quick_validate.py helper.  Run its portable analytic self-test from
      # the packaged copy instead; this exercises the standalone bundle that
      # users actually install.
      - run: python skills/flexible-mof-gateopen/scripts/self_test.py
      - run: python scripts/validate_example.py
      - run: python scripts/validate_advanced.py --out /tmp/advanced-checks.json
