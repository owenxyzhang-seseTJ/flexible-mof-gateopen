name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,structure,guest]'
      - run: python -m pytest -q
      - run: python skills/flexible-mof-gateopen/scripts/quick_validate.py skills/flexible-mof-gateopen
      - run: python scripts/validate_example.py
