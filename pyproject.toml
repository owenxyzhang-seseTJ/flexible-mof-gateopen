[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexible-mof-gateopen"
version = "0.1.0"
description = "Auditable fixed-host GCMC and osmotic gate-opening screening utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cif = ["gemmi>=0.6"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
