[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flexible-mof-gateopen"
version = "0.4.0"
description = "Auditable fixed-host GCMC and osmotic gate-opening screening utilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xiaoyu Zhang", email = "owenxyzhang@gmail.com" }]
keywords = [
  "MOF", "flexible-framework", "gate-opening", "GCMC", "RASPA", "adsorption",
  "osmotic-integration", "free-energy", "porous-materials",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cif = ["gemmi>=0.6"]
structure = ["gemmi>=0.6", "ase>=3.22", "pymatgen>=2023.8", "spglib>=2"]
guest = ["rdkit>=2023.9"]
ui = ["streamlit>=1.40"]
xtb = ["tblite>=0.5"]
advanced = ["numpy>=1.24", "scipy>=1.10", "CoolProp>=7", "ase>=3.22", "phonopy>=2.30"]
ml = ["chgnet>=0.4.2"]
mace = ["mace-torch>=0.3.10"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/owenxyzhang-seseTJ/flexible-mof-gateopen"
Repository = "https://github.com/owenxyzhang-seseTJ/flexible-mof-gateopen"
Issues = "https://github.com/owenxyzhang-seseTJ/flexible-mof-gateopen/issues"
Changelog = "https://github.com/owenxyzhang-seseTJ/flexible-mof-gateopen/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
